; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Sin esto, `pio run` tambien intentaria compilar el firmware para native y
; fallaria (ESP-IDF no esta disponible en el PC).
default_envs = lolin-s3-mini

; ---------------------------------------------------------------------------
; Pulsera: compila y sube a la placa.   pio run -t upload
; ---------------------------------------------------------------------------
[env:lolin-s3-mini]
platform = espressif32
board = lolin_s3_mini
framework = espidf
monitor_speed = 115200
; BAND_SIM=0: sensores reales; radio ESP-NOW y bateria aun no integradas.
; BAND_SIM_FAST=0: temporizacion real para probar los sensores.
build_flags =
    -DBAND_SIM=0
    -DBAND_SIM_FAST=0

; ---------------------------------------------------------------------------
; Pruebas en el PC (sin placa).   pio test -e native
; Necesita un compilador de C/C++ instalado (gcc en Linux/Mac, MinGW en Windows).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -I../common
; test_robot_roundtrip prueba pulsera y robot juntos: necesita las librerias del robot.
lib_extra_dirs = ../cogni-desk/lib
