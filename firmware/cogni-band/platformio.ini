; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Sin esto, `pio run` tambien intentaria compilar main.cpp para el entorno
; native y fallaria (Arduino.h no existe en el PC).
default_envs = esp32-c3-devkitm-1

; ---------------------------------------------------------------------------
; Pulsera: compila y sube a la placa.   pio run -t upload
; ---------------------------------------------------------------------------
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; En el ESP32-C3 el Serial va por USB nativo. Sin estas dos banderas el
; monitor serie no muestra nada y parece que el programa no corre.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Pruebas en el PC (sin placa).   pio test -e native
; Necesita un compilador de C/C++ instalado (gcc en Linux/Mac, MinGW en Windows).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
