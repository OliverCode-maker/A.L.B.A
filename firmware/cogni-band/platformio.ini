; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Sin esto, `pio run` tambien intentaria compilar main.cpp para el entorno
; native y fallaria (Arduino.h no existe en el PC).
default_envs = lolin-s3-mini

; ---------------------------------------------------------------------------
; Pulsera: compila y sube a la placa.   pio run -t upload
; ---------------------------------------------------------------------------
[env:lolin-s3-mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
; En los ESP32-C3/S3 el Serial va por USB nativo. Sin estas dos banderas el
; monitor serie no muestra nada y parece que el programa no corre.
; -I../common: carpeta compartida con el robot (alba_protocol.h).
; BAND_SIM=1: sensores y robot simulados (se ve todo en el monitor serie).
;   Con los drivers reales listos, poner BAND_SIM=0.
; BAND_SIM_FAST=1: guion de ~100 s; 0 = tiempos reales (el despertar tarda minutos).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBAND_SIM=1
    -DBAND_SIM_FAST=1
    -I../common

; ---------------------------------------------------------------------------
; Pruebas en el PC (sin placa).   pio test -e native
; Necesita un compilador de C/C++ instalado (gcc en Linux/Mac, MinGW en Windows).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -I../common
; test_robot_roundtrip prueba pulsera y robot juntos: necesita las librerias del robot.
lib_extra_dirs = ../cogni-desk/lib
