; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Sin esto, `pio run` tambien intentaria compilar src/main.cpp para el entorno
; native y fallaria (Arduino.h no existe en el PC).
default_envs = esp32-s3-devkitc-1

; ---------------------------------------------------------------------------
; Robot: compila y sube a la placa.   pio run -t upload
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.9
    knolleary/PubSubClient @ ^2.8
; Carpeta compartida con la pulsera: aqui vive alba_protocol.h, el formato de
; los mensajes que el robot recibe por ESP-NOW. Se usa con #include "alba_protocol.h".
build_flags = -I../common

; ---------------------------------------------------------------------------
; Pruebas en el PC (sin placa).   pio test -e native
; Necesita un compilador de C/C++ instalado (gcc en Linux/Mac, MinGW en Windows).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -I../common

; ---------------------------------------------------------------------------
; Prueba de enlace pulsera <-> robot (sin WiFi, sin nube, sin pantallas).
;   pio run -e linktest -t upload      y despues:   pio device monitor
; Compila solo CommManager + link_test_main.cpp, asi que no depende del resto
; del robot (que aun esta en construccion). Ver docs/prueba-enlace.md.
; ---------------------------------------------------------------------------
[env:linktest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
; COMM_FAKE_EPOCH_S = hora inventada (2026-10-26 12:00 UTC = 07:00 en Ecuador): no hay internet en esta prueba.
build_src_filter = -<*> +<CommManager.cpp> +<link_test_main.cpp>
build_flags =
    -I../common
    -DCOMM_WIFI_DISABLED=1
    -DCOMM_ESPNOW_CHANNEL=1
    -DCOMM_FAKE_EPOCH_S=1793016000
