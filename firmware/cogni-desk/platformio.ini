; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Sin esto, `pio run` tambien intentaria compilar src/main.cpp para el entorno
; native y fallaria (Arduino.h no existe en el PC).
default_envs = esp32-s3-devkitc-1

; ---------------------------------------------------------------------------
; Robot: compila y sube a la placa.   pio run -t upload
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Carpeta compartida con la pulsera: aqui vive alba_protocol.h, el formato de
; los mensajes que el robot recibe por ESP-NOW. Se usa con #include "alba_protocol.h".
build_flags = -I../common

; ---------------------------------------------------------------------------
; Pruebas en el PC (sin placa).   pio test -e native
; Necesita un compilador de C/C++ instalado (gcc en Linux/Mac, MinGW en Windows).
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -I../common
